name: Refresh package lock

on:
  push:
    branches:
      - cleanup/native-only-consistency

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/native-only-consistency
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lock file
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock update when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "package: refresh native-only lockfile"
          git push origin HEAD:cleanup/native-only-consistency
