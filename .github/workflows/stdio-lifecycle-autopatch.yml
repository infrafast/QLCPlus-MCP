name: STDIO lifecycle autopatch

on:
  push:
    branches:
      - fix/stdio-lifecycle-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stdio-lifecycle-cleanup

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
          cache: npm

      - name: Apply lifecycle hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          native = Path('src/qlc/nativeClient.ts')
          text = native.read_text(encoding='utf-8')
          marker = '''export function getNativeClient(): QlcNativeClient | null {\n  return nativeClient;\n}\n'''
          replacement = '''export function stopNativeClient(): void {\n  nativeClient?.stop();\n  nativeClient = null;\n}\n\nexport function getNativeClient(): QlcNativeClient | null {\n  return nativeClient;\n}\n'''
          if marker not in text:
              raise SystemExit('Expected native client accessor was not found')
          text = text.replace(marker, replacement, 1)
          native.write_text(text, encoding='utf-8')

          stdio = Path('src/transports/stdio.ts')
          text = stdio.read_text(encoding='utf-8')
          import_marker = 'import { createQlcMcpServer } from "../mcpServer.js";\n'
          if import_marker not in text:
              raise SystemExit('Expected stdio import marker was not found')
          text = text.replace(import_marker, import_marker + 'import { stopNativeClient } from "../qlc/nativeClient.js";\n', 1)
          old = '''  const server = createQlcMcpServer(tools);\n  const transport = new StdioServerTransport();\n  transport.onclose = () => {\n    logger.info("STDIO transport closed");\n  };\n  transport.onerror = (error) => {\n    logger.error({ err: error }, "STDIO transport error");\n    process.exit(1);\n  };\n'''
          new = '''  const server = createQlcMcpServer(tools);\n  const transport = new StdioServerTransport();\n  let shuttingDown = false;\n  const shutdown = (exitCode: number): void => {\n    if (shuttingDown) return;\n    shuttingDown = true;\n    stopNativeClient();\n    process.exit(exitCode);\n  };\n  transport.onclose = () => {\n    logger.info("STDIO transport closed");\n    shutdown(0);\n  };\n  transport.onerror = (error) => {\n    logger.error({ err: error }, "STDIO transport error");\n    shutdown(1);\n  };\n'''
          if old not in text:
              raise SystemExit('Expected stdio lifecycle block was not found')
          text = text.replace(old, new, 1)
          stdio.write_text(text, encoding='utf-8')

          index = Path('src/index.ts')
          text = index.read_text(encoding='utf-8')
          old_import = 'import { initNativeClient } from "./qlc/nativeClient.js";\n'
          new_import = 'import { initNativeClient, stopNativeClient } from "./qlc/nativeClient.js";\n'
          if old_import not in text:
              raise SystemExit('Expected native client import was not found')
          text = text.replace(old_import, new_import, 1)
          if text.count('process.exit(1);') != 2:
              raise SystemExit('Expected exactly two fatal process.exit(1) calls')
          text = text.replace('process.exit(1);', 'shutdown(1);')
          marker = 'const runtimeEnvFile = loadRuntimeEnv();\n\n'
          handler = '''const runtimeEnvFile = loadRuntimeEnv();\n\nlet shuttingDown = false;\nfunction shutdown(exitCode: number): void {\n  if (shuttingDown) return;\n  shuttingDown = true;\n  stopNativeClient();\n  process.exit(exitCode);\n}\n\nprocess.once("SIGINT", () => shutdown(0));\nprocess.once("SIGTERM", () => shutdown(0));\n\n'''
          if marker not in text:
              raise SystemExit('Expected runtime env marker was not found')
          text = text.replace(marker, handler, 1)
          index.write_text(text, encoding='utf-8')

          test = Path('tests/lifecycle.test.ts')
          test.write_text('''import fs from "node:fs";\nimport { describe, expect, it } from "vitest";\n\n\ndescribe("stdio lifecycle hardening", () => {\n  it("stops the QLC native client when stdio closes", () => {\n    const source = fs.readFileSync("src/transports/stdio.ts", "utf8");\n    expect(source).toContain("stopNativeClient();");\n    expect(source).toContain("shutdown(0);");\n    expect(source).toContain("shutdown(1);");\n  });\n\n  it("handles SIGINT and SIGTERM through the same cleanup", () => {\n    const source = fs.readFileSync("src/index.ts", "utf8");\n    expect(source).toContain('process.once("SIGINT", () => shutdown(0))');\n    expect(source).toContain('process.once("SIGTERM", () => shutdown(0))');\n  });\n});\n''', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate patch
        run: |
          npm run build
          npm run test:ci

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/stdio-lifecycle-autopatch.yml
          git add src/index.ts src/transports/stdio.ts src/qlc/nativeClient.ts tests/lifecycle.test.ts
          git commit -m "fix: terminate stdio server resources on disconnect"
          git push origin HEAD:fix/stdio-lifecycle-cleanup
